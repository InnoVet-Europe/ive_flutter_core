  
name: ive_flutter_core
description: Core assets for InnoVet Europe Flutter projects
# version: 1.2.6f
version: 1.2.12
homepage: https://www.harriercentral.com/
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ^3.38.3

dependencies:
  flutter:
    sdk: flutter

  flutter_spinkit: ^5.2.2 
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  photo_view: ^0.15.0 
  qr_flutter: 4.1.0 
  
dev_dependencies:
  # freezed only generates code, so it is a dev dependency (1.2.12): as a
  # normal dependency it forced freezed 3 on every app using this package,
  # which blocked freezed 4 and the Dart 3.13 language version (Flutter 3.47).
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  
  uses-material-design: true

  fonts:

    - family: AvenirNextDemiBold
      fonts:
        - asset: fonts/AvenirNextDemiBold.ttf
        - asset: fonts/AvenirNextDemiBoldItalic.ttf
          style: italic

